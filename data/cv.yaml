# Fictional example CV used by the demo and the tests.
#
# Skills are not listed on their own: they come from the `tech` of projects
# and jobs, so every skill has evidence. Skills without a project or job go
# into `other_skills` and count as unverified.
# Every fact gets an ID when the CV is loaded (p1.f1, e1.f1, ...), and cover
# letters must cite these IDs.

