# Skill vocabulary shared by CVs and vacancies.
# Both sides are normalized to these canonical names before matching,
# so "sklearn" in a vacancy matches "scikit-learn" in a CV.
# Aliases are matched case-insensitively, so avoid aliases that are also common
# English words in job ads ("CV" would match "send your CV", "REST" would match "the rest").

# programming
