[project]
name = "job-agent"
version = "0.1.0"
description = "Tool-using AI agent that finds AI/ML Werkstudent roles in Berlin, scores them against a CV and drafts grounded cover letters"
readme = "README.md"
authors = [
    { name = "Kirill Konstantinovskii", email = "Kirill.Konstantinovskii@stud.srh-university.de" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ai-agent", "mcp", "llm", "tool-calling", "evals", "fastapi", "groq"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "openai>=3.37.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[project.urls]
Repository = "https://github.com/Kirill-ark/Job-Application-Agent"
Demo = "https://job-application-agent-f2mr.onrender.com"

[project.scripts]
job-agent-mcp = "job_agent.mcp_server.__main__:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
