[project]
name = "job-agent"
version = "0.1.0"
description = "Tool-using AI agent that finds AI/ML Werkstudent roles in Berlin, scores them against a CV and drafts grounded cover letters"
readme = "README.md"
authors = [
    { name = "kirillkonstantinovskij", email = "Kirill.Konstantinovskii@stud.srh-university.de" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
