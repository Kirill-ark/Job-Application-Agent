name: CI

on:
  push:
  pull_request:

# Read-only token: CI only checks the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit: a moved tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
      - run: uv sync --frozen
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests (no network, no LLM)
        run: uv run pytest -q
      # The only eval that needs no LLM. The others run by hand (evals.yml):
      # Groq's free tier allows 200,000 tokens a day, one agent suite uses ~60,000.
      - name: Match scoring eval
        run: uv run python -m evals.run_evals --suite matching

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t job-agent .
