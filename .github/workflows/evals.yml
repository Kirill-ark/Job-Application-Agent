name: LLM evals

# Started by hand from the Actions tab: they use the free Groq budget of a day.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Which suite"
        type: choice
        options: [agent, safety, letters, all]
        default: agent

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
      - run: uv sync --frozen
      # The input goes through an environment variable, never into the script text.
      - run: uv run python -m evals.run_evals --suite "$SUITE"
        env:
          SUITE: ${{ inputs.suite }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-results
          path: evals/results/
